name: Chromatic

# The build needs the Chromatic project token, and GitHub withholds a repository
# secret from a fork pull request. CONTRIBUTING.md records the fork policy.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Chromatic needs the full git history to find baselines and to let
          # TurboSnap detect changed files.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # A visual change fails the check until a maintainer accepts or
          # rejects it. chromatic.config.json auto-accepts on main.
          exitZeroOnChanges: false
          # A manual run is a deliberate rebuild; without this the CLI skips
          # rebuilds of an already passed commit.
          forceRebuild: ${{ github.event_name == 'workflow_dispatch' }}
